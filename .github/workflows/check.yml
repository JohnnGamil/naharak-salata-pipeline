name: check-services
# All tests + can the runner reach every outside service? Read-only, spends no daily allowance.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt cryptography
      - uses: actions/cache@v4
        with:
          path: data/models
          key: whisper-models-v1
      - env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          echo "RUNNER=github" >> .env
      - run: python -m pytest -q tests
      - run: python scripts/check_services.py 2>/dev/null
