name: bench-render
# Timing test: one full CPU render of a saved job on a free GitHub runner.
on: workflow_dispatch
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: python deps
        run: pip install -q numpy pillow pydantic pydantic-settings httpx tenacity
      - name: cpu
        run: nproc && free -h
      - name: render
        run: python scripts/bench_render.py bench/job4
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: bench/job4_out/final.mp4
