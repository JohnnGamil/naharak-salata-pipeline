name: tick
# The whole channel, hourly: pull encrypted state from R2, post what is due, make videos, push state.
# 18 runs/day (07:17-00:17 Cairo) keeps a private repo inside the free 2,000 minutes/month.
on:
  # The hourly start comes from a Cloudflare cron (cron_worker/): GitHub's own schedule skipped the whole
  # morning of 2026-10-28. This one is only the spare, every 3 hours; it stops at once if the clock ran.
  schedule:
    - cron: "53 4-21/3 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "minutes of video making"
        default: "40"
      dry:
        description: "test copy of the state, posting off, Telegram off"
        type: boolean
        default: false
      source:
        description: "cron = the Cloudflare clock started this run"
        default: "manual"
      post_now:
        description: "post today's next video now instead of at its slot"
        type: boolean
        default: false
      extra:
        description: "make this many new videos now, on top of the ready queue"
        default: "0"
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg + fonts
        timeout-minutes: 10
        # 2026-11-11: apt hung 55 min twice and both posting runs were cancelled -> cap it, then a static build
        run: |
          if ! (timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq ffmpeg > /dev/null); then
            echo "apt stuck, using the static ffmpeg build"
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - name: python deps
        run: pip install -q -r requirements.txt cryptography
      - name: whisper model cache
        uses: actions/cache@v4
        with:
          path: data/models
          key: whisper-models-v1
      - name: settings
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          # the repo is public (2026-11-17, free minutes): every value in the settings is masked in the logs,
          # since GitHub only masks a secret as a whole and ENV_FILE holds many keys
          while IFS= read -r line; do
            val="${line#*=}"; val="${val%$'\r'}"
            if [ "$line" != "$val" ] && [ ${#val} -ge 8 ]; then echo "::add-mask::$val"; fi
          done < .env
          echo "RUNNER=github" >> .env
          [ -n "$GROQ_API_KEY" ] && echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env  # free backup brain + face finder
          echo "BUFFER_SIZE=3" >> .env  # keep 3 videos ready (the secret still says 2)
          echo "GEMINI_MODELS=gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.7-flash" >> .env  # flash-latest / flash-lite-latest answer 404 since 2026-11-10
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            echo "STATE_NS=dryrun" >> .env
            echo "UPLOAD_ENABLED=false" >> .env
            echo "TELEGRAM_BOT_TOKEN=" >> .env
          fi
      - name: tick
        env:
          TICK_SOURCE: ${{ github.event.inputs.source || github.event_name }}
          POST_NOW: ${{ github.event.inputs.post_now }}
          EXTRA_VIDEOS: ${{ github.event.inputs.extra || '0' }}
        run: python -m src.tick --budget "${{ github.event.inputs.budget || '40' }}"
      - name: tell John on Telegram
        if: failure()
        run: python scripts/notify_failure.py "tick"
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: data/logs/
          retention-days: 7
          if-no-files-found: ignore
